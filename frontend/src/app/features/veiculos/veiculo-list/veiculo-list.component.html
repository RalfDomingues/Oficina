<div class="page">
    <div class="header">
        <h2>Veículos</h2>

        <div class="actions">
            <mat-form-field appearance="outline" class="search">
                <mat-label>Buscar (placa/modelo/marca/tipo/cliente)</mat-label>
                <input matInput [(ngModel)]="search" (ngModelChange)="onSearchChange()" />
            </mat-form-field>

            <button mat-stroked-button (click)="filtrarPorClientePrompt()">
                <mat-icon>filter_alt</mat-icon>
                Filtrar por cliente
            </button>

            <button mat-stroked-button *ngIf="clienteIdFiltro != null" (click)="limparFiltroCliente()">
                <mat-icon>close</mat-icon>
                Limpar cliente ({{ clienteIdFiltro }})
            </button>

            <button mat-raised-button color="primary" (click)="abrirCriar()">
                <mat-icon>add</mat-icon>
                Novo
            </button>
        </div>
    </div>

    <div class="table-wrap" *ngIf="!loading; else loadingTpl">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">

            <ng-container matColumnDef="placa">
                <th mat-header-cell *matHeaderCellDef>Placa</th>
                <td mat-cell *matCellDef="let v">{{ v.placa }}</td>
            </ng-container>

            <ng-container matColumnDef="modelo">
                <th mat-header-cell *matHeaderCellDef>Modelo</th>
                <td mat-cell *matCellDef="let v">{{ v.modelo }}</td>
            </ng-container>

            <ng-container matColumnDef="marca">
                <th mat-header-cell *matHeaderCellDef>Marca</th>
                <td mat-cell *matCellDef="let v">{{ v.marca }}</td>
            </ng-container>

            <ng-container matColumnDef="ano">
                <th mat-header-cell *matHeaderCellDef>Ano</th>
                <td mat-cell *matCellDef="let v">{{ v.ano }}</td>
            </ng-container>

            <ng-container matColumnDef="tipo">
                <th mat-header-cell *matHeaderCellDef>Tipo</th>
                <td mat-cell *matCellDef="let v">{{ v.tipo }}</td>
            </ng-container>

            <ng-container matColumnDef="clienteNome">
                <th mat-header-cell *matHeaderCellDef>Cliente</th>
                <td mat-cell *matCellDef="let v">
                    {{ v.clienteNome || ('#' + v.clienteId) }}
                </td>
            </ng-container>


            <ng-container matColumnDef="ativo">
                <th mat-header-cell *matHeaderCellDef>Ativo</th>
                <td mat-cell *matCellDef="let v">{{ v.ativo ? 'Sim' : 'Não' }}</td>
            </ng-container>

            <ng-container matColumnDef="acoes">
                <th mat-header-cell *matHeaderCellDef>Ações</th>
                <td mat-cell *matCellDef="let v" class="acoes">
                    <button mat-icon-button (click)="abrirEditar(v)" aria-label="Editar">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button (click)="confirmarDelete(v)" aria-label="Remover">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <mat-paginator [length]="totalElements" [pageIndex]="pageIndex" [pageSize]="pageSize"
            [pageSizeOptions]="[5, 10, 20, 50]" (page)="onPage($event)">
        </mat-paginator>
    </div>

    <ng-template #loadingTpl>
        <div class="loading">Carregando...</div>
    </ng-template>
</div>
