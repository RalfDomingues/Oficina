<!-- veiculo-form-dialog.component.html -->
<h2 mat-dialog-title>
  {{ data.mode === 'create' ? 'Novo veículo' : 'Editar veículo' }}
</h2>

<form [formGroup]="form" (ngSubmit)="salvar()">
  <div mat-dialog-content class="form-grid">

    <mat-form-field appearance="outline">
      <mat-label>Placa</mat-label>
      <input matInput formControlName="placa" placeholder="ABC1D23" />
      <mat-error *ngIf="form.get('placa')?.hasError('required')">
        Placa é obrigatória
      </mat-error>
      <mat-error *ngIf="form.get('placa')?.hasError('pattern')">
        Formato inválido (ABC1D23)
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Modelo</mat-label>
      <input matInput formControlName="modelo" />
      <mat-error *ngIf="form.get('modelo')?.hasError('required')">
        Modelo é obrigatório
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Marca</mat-label>
      <input matInput formControlName="marca" />
      <mat-error *ngIf="form.get('marca')?.hasError('required')">
        Marca é obrigatória
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Ano</mat-label>
      <input matInput type="number" formControlName="ano" />
      <mat-error *ngIf="form.get('ano')?.hasError('required')">
        Ano é obrigatório
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="tipo">
        <mat-option *ngFor="let tipo of tipos" [value]="tipo">
          {{ tipo }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('tipo')?.hasError('required')">
        Tipo é obrigatório
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cliente</mat-label>
      <mat-select formControlName="clienteId">
        <mat-optgroup label="Clientes ativos">
          <mat-option *ngFor="let cliente of clientes" [value]="cliente.id">
            {{ cliente.nome }}
          </mat-option>
        </mat-optgroup>
      </mat-select>
      <mat-error *ngIf="form.get('clienteId')?.hasError('required')">
        Cliente é obrigatório
      </mat-error>
    </mat-form-field>

  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</form>
