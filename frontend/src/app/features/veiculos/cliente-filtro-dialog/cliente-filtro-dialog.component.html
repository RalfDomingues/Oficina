<h2 mat-dialog-title>Filtrar por cliente</h2>

<div mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Cliente (nome ou ID)</mat-label>

    <input matInput [formControl]="query" [matAutocomplete]="auto" placeholder="Ex: João / Maria / 12" />

    <button mat-icon-button matSuffix type="button" aria-label="Limpar" *ngIf="temValor" (click)="limpar()">
      <mat-icon>close</mat-icon>
    </button>

    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayWith"
      (optionSelected)="selecionar($event.option.value)">
      <mat-option *ngFor="let cliente of (filtered$ | async)" [value]="cliente">
        {{ cliente.nome }}
        <span class="muted">(#{{ cliente.id }})</span>
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>

  <small class="hint">
    Dica: você pode digitar apenas o ID e clicar em “Aplicar”.
  </small>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="aplicarDigitado()">
    Aplicar
  </button>
</div>
