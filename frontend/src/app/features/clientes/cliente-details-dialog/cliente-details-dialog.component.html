<h2 mat-dialog-title>Detalhes do cliente</h2>

<div mat-dialog-content class="content">
    <div class="row">
        <div class="label">ID</div>
        <div class="value">#{{ cliente.id || '-' }}</div>
    </div>

    <div class="row">
        <div class="label">Nome</div>
        <div class="value">{{ cliente.nome || '-' }}</div>
    </div>

    <div class="row">
        <div class="label">CPF</div>
        <div class="value">{{ cpfFormatado }}</div>
    </div>

    <div class="row">
        <div class="label">Email</div>
        <div class="value">{{ email || '-' }}</div>
    </div>

    <div class="row">
        <div class="label">Telefone</div>
        <div class="value">{{ telefoneFormatado }}</div>
    </div>

    <div class="row">
        <div class="label">Status</div>
        <div class="value">{{ cliente.ativo ? 'Ativo' : 'Inativo' }}</div>
    </div>

    <div class="actions">
        <button mat-button type="button" (click)="close()">Fechar</button>
    </div>
</div>
