<h2 mat-dialog-title>{{ isEdit ? 'Editar cliente' : 'Novo cliente' }}</h2>

<div mat-dialog-content class="content">
    <div class="state" *ngIf="errorMsg">{{ errorMsg }}</div>

    <form [formGroup]="form" class="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full">
            <mat-label>Nome</mat-label>
            <input matInput formControlName="nome" autocomplete="off" />
            <mat-error *ngIf="form.controls.nome.invalid && form.controls.nome.touched">
                Informe um nome válido.
            </mat-error>
        </mat-form-field>

        <!-- ✅ CPF obrigatório -->
        <mat-form-field appearance="outline" class="full">
            <mat-label>CPF</mat-label>
            <input matInput formControlName="cpf" autocomplete="off" inputmode="numeric" placeholder="Somente números"
                (input)="onCpfInput($event)" />
            <mat-hint>11 dígitos</mat-hint>
            <mat-error *ngIf="form.controls.cpf.hasError('required') && form.controls.cpf.touched">
                CPF é obrigatório.
            </mat-error>
            <mat-error *ngIf="form.controls.cpf.hasError('pattern') && form.controls.cpf.touched">
                CPF deve ter 11 dígitos.
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" autocomplete="off" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
            <mat-label>Telefone</mat-label>
            <input matInput formControlName="telefone" autocomplete="off" (input)="onTelefoneInput($event)" />
        </mat-form-field>

        <div class="actions">
            <button mat-button type="button" (click)="close()" [disabled]="loading">
                Cancelar
            </button>

            <button mat-flat-button color="primary" type="submit" [disabled]="loading">
                {{ loading ? 'Salvando...' : (isEdit ? 'Salvar' : 'Criar') }}
            </button>
        </div>
    </form>
</div>
