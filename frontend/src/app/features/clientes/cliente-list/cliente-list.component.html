<div class="page">
  <div class="header">
    <div>
      <h2>Clientes</h2>
      <p class="sub">Gerencie cadastros e visualize informações rapidamente.</p>
    </div>
    <button mat-raised-button color="primary" (click)="abrirNovo()" *ngIf="canWrite">
      <mat-icon>add</mat-icon>
      Novo cliente
    </button>
  </div>

  <!-- TABS -->
  <mat-tab-group [(selectedIndex)]="abaSelecionada" class="tabs-section">

    <!-- ABA 1: ATIVOS -->
    <mat-tab label="Ativos ({{ clientesAtivos.length }})">
      <div class="toolbar">
        <mat-form-field appearance="outline" class="search">
          <mat-label>Pesquisar</mat-label>
          <mat-icon matPrefix>search</mat-icon>
          <input matInput [(ngModel)]="search" (ngModelChange)="applyFilter()" placeholder="Nome, email, telefone..." />
          <button *ngIf="search" mat-icon-button matSuffix (click)="search=''; applyFilter()" aria-label="Limpar">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>

      <mat-card class="table-card">
        <div class="table-wrap" [class.loading]="loading">
          <table mat-table [dataSource]="clientesAtivos" class="table-base">
            <ng-container matColumnDef="nome">
              <th mat-header-cell *matHeaderCellDef>Nome</th>
              <td mat-cell *matCellDef="let row" class="col-nome truncate">{{ row.nome }}</td>
            </ng-container>

            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>Email</th>
              <td mat-cell *matCellDef="let row" class="col-email truncate">{{ row.email || '-' }}</td>
            </ng-container>

            <ng-container matColumnDef="telefone">
              <th mat-header-cell *matHeaderCellDef>Telefone</th>
              <td mat-cell *matCellDef="let row" class="col-telefone">{{ row.telefone || '-' }}</td>
            </ng-container>

            <ng-container matColumnDef="acoes">
              <th mat-header-cell *matHeaderCellDef>Ações</th>
              <td mat-cell *matCellDef="let row" class="col-acoes">
                <button mat-icon-button (click)="verDetalhes(row)" aria-label="Ver">
                  <mat-icon>visibility</mat-icon>
                </button>
                <button mat-icon-button *ngIf="canWrite" (click)="editar(row)" aria-label="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button *ngIf="canWrite" (click)="excluir(row)" aria-label="Excluir">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['nome', 'email', 'telefone', 'acoes']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['nome', 'email', 'telefone', 'acoes']"></tr>
          </table>
        </div>
      </mat-card>
    </mat-tab>

    <!-- ABA 2: INATIVOS -->
    <mat-tab label="Inativos ({{ clientesInativos.length }})">
      <mat-card class="table-card">
        <div class="table-wrap" [class.loading]="loading">
          <table mat-table [dataSource]="clientesInativos" class="table-base">
            <ng-container matColumnDef="nome">
              <th mat-header-cell *matHeaderCellDef>Nome</th>
              <td mat-cell *matCellDef="let row" class="col-nome truncate">{{ row.nome }}</td>
            </ng-container>

            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>Email</th>
              <td mat-cell *matCellDef="let row" class="col-email truncate">{{ row.email || '-' }}</td>
            </ng-container>

            <ng-container matColumnDef="telefone">
              <th mat-header-cell *matHeaderCellDef>Telefone</th>
              <td mat-cell *matCellDef="let row" class="col-telefone">{{ row.telefone || '-' }}</td>
            </ng-container>

            <ng-container matColumnDef="acoes">
              <th mat-header-cell *matHeaderCellDef>Ações</th>
              <td mat-cell *matCellDef="let row" class="col-acoes">
                <button mat-icon-button (click)="verDetalhes(row)" aria-label="Ver">
                  <mat-icon>visibility</mat-icon>
                </button>
                <button mat-icon-button *ngIf="canWrite" (click)="reativar(row)" aria-label="Reativar">
                  <mat-icon>restore</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['nome', 'email', 'telefone', 'acoes']"></tr>
            <tr mat-row *matRowDef="let row; columns: ['nome', 'email', 'telefone', 'acoes']"></tr>
          </table>
        </div>
      </mat-card>
    </mat-tab>

  </mat-tab-group>
</div>
