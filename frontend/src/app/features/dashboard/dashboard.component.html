<div class="dash">

    <div class="dash-header">
        <div>
            <h1 class="title">Dashboard</h1>
            <p class="subtitle">Visão geral da oficina</p>
        </div>
    </div>

    <div *ngIf="loading" class="state">Carregando...</div>
    <div *ngIf="!loading && error" class="state error">{{ error }}</div>

    <ng-container *ngIf="!loading && !error">

        <!-- Cards -->
        <div class="cards">
            <div class="card" *ngFor="let card of cards">
                <div class="card-label">{{ card.label }}</div>
                <div class="card-value">{{ card.value }}</div>
            </div>
        </div>

        <div class="grid">
            <!-- Top serviços -->
            <section class="panel">
                <div class="panel-title">Serviços mais usados</div>

                <div *ngIf="servicosMaisUsados.length === 0" class="empty">
                    Sem dados.
                </div>

                <div class="list" *ngIf="servicosMaisUsados.length > 0">
                    <div class="row header">
                        <div>Serviço</div>
                        <div class="right">Qtd.</div>
                    </div>

                    <div class="row" *ngFor="let servico of servicosMaisUsados">
                        <div class="strong">{{ servico.nomeServico }}</div>
                        <div class="right">{{ servico.quantidade }}</div>
                    </div>
                </div>
            </section>

            <!-- Ordens por mês -->
            <section class="panel">
                <div class="panel-title">Ordens por mês</div>

                <div *ngIf="ordensPorMes.length === 0" class="empty">
                    Sem dados.
                </div>

                <div class="list" *ngIf="ordensPorMes.length > 0">
                    <div class="row header">
                        <div>Mês</div>
                        <div class="right">Qtd.</div>
                    </div>

                    <div class="row" *ngFor="let ordem of ordensPorMes">
                        <div class="strong">{{ formatMes(ordem.mes) }}</div>
                        <div class="right">{{ ordem.quantidade }}</div>
                    </div>
                </div>
            </section>
        </div>
    </ng-container>
</div>
