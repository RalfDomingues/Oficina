<div class="page">
    <div class="header">
        <div>
            <h2>Usuários</h2>
            <p class="sub">Gerencie acessos e perfis do sistema.</p>
        </div>
        <button mat-raised-button color="primary" (click)="abrirCriar()">
            <mat-icon>add</mat-icon>
            Novo usuário
        </button>
    </div>

    <mat-card class="table-card">
        <div class="table-wrap" [class.loading]="loading">
            <table mat-table [dataSource]="dataSource" class="table-base mat-elevation-z0">

                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef>Nome</th>
                    <td mat-cell *matCellDef="let row" class="col-nome">{{ row.nome }}</td>
                </ng-container>

                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef>Email</th>
                    <td mat-cell *matCellDef="let row" class="col-email">{{ row.email }}</td>
                </ng-container>

                <ng-container matColumnDef="perfil">
                    <th mat-header-cell *matHeaderCellDef>Perfil</th>
                    <td mat-cell *matCellDef="let row" class="col-perfil">{{ row.perfil }}</td>
                </ng-container>

                <ng-container matColumnDef="ativo">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let row" class="col-status">{{ row.ativo ? 'Ativo' : 'Inativo' }}</td>
                </ng-container>

                <ng-container matColumnDef="acoes">
                    <th mat-header-cell *matHeaderCellDef>Ações</th>
                    <td mat-cell *matCellDef="let row" class="col-acoes">
                        <button mat-icon-button (click)="abrirEditar(row)" aria-label="Editar">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button (click)="confirmarDelete(row)" aria-label="Desativar">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>

        <mat-paginator [length]="totalElements" [pageIndex]="pageIndex" [pageSize]="pageSize"
            [pageSizeOptions]="[5, 10, 20, 50]" (page)="onPage($event)"></mat-paginator>
    </mat-card>
</div>
