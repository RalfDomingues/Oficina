<div class="page">
    <div class="header">
        <div>
            <h2>Usuarios</h2>
            <p class="sub">Gerencie acessos e perfis do sistema.</p>
        </div>
        <button mat-raised-button color="primary" (click)="abrirCriar()">
            <mat-icon>add</mat-icon>
            Novo usuario
        </button>
    </div>

    <mat-tab-group [(selectedIndex)]="abaSelecionada" (selectedIndexChange)="onTabChange($event)" class="tabs-section">

        <mat-tab [label]="'Ativos (' + totalAtivosElements + ')'">
            <mat-card class="table-card">
                <div class="table-wrap" [class.loading]="loadingAtivos">
                    <table mat-table [dataSource]="usuariosAtivos" class="table-base">

                        <ng-container matColumnDef="nome">
                            <th mat-header-cell *matHeaderCellDef>Nome</th>
                            <td mat-cell *matCellDef="let row">{{ row.nome }}</td>
                        </ng-container>

                        <ng-container matColumnDef="email">
                            <th mat-header-cell *matHeaderCellDef>Email</th>
                            <td mat-cell *matCellDef="let row">{{ row.email }}</td>
                        </ng-container>

                        <ng-container matColumnDef="perfil">
                            <th mat-header-cell *matHeaderCellDef>Perfil</th>
                            <td mat-cell *matCellDef="let row">
                                <span class="perfil-badge" [class]="row.perfil?.toLowerCase()">
                                    {{ row.perfil }}
                                </span>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="acoes">
                            <th mat-header-cell *matHeaderCellDef>Acoes</th>
                            <td mat-cell *matCellDef="let row" class="col-acoes">
                                <button mat-icon-button (click)="abrirEditar(row)" matTooltip="Editar">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-icon-button (click)="confirmarDesativar(row)" matTooltip="Desativar">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>

                    <div class="no-data" *ngIf="!loadingAtivos && usuariosAtivos.data.length === 0">
                        <mat-icon>person_off</mat-icon>
                        <p>Nenhum usuario ativo encontrado</p>
                    </div>

                    <div class="loading-overlay" *ngIf="loadingAtivos">
                        <mat-spinner diameter="40"></mat-spinner>
                    </div>
                </div>

                <mat-paginator [length]="totalAtivosElements" [pageIndex]="pageIndexAtivos" [pageSize]="pageSizeAtivos"
                    [pageSizeOptions]="[5, 10, 20, 50]" (page)="onPageChangeAtivos($event)">
                </mat-paginator>
            </mat-card>
        </mat-tab>

        <mat-tab [label]="'Inativos (' + totalInativosElements + ')'">
            <mat-card class="table-card">
                <div class="table-wrap" [class.loading]="loadingInativos">
                    <table mat-table [dataSource]="usuariosInativos" class="table-base">

                        <ng-container matColumnDef="nome">
                            <th mat-header-cell *matHeaderCellDef>Nome</th>
                            <td mat-cell *matCellDef="let row" class="inactive">{{ row.nome }}</td>
                        </ng-container>

                        <ng-container matColumnDef="email">
                            <th mat-header-cell *matHeaderCellDef>Email</th>
                            <td mat-cell *matCellDef="let row" class="inactive">{{ row.email }}</td>
                        </ng-container>

                        <ng-container matColumnDef="perfil">
                            <th mat-header-cell *matHeaderCellDef>Perfil</th>
                            <td mat-cell *matCellDef="let row" class="inactive">
                                <span class="perfil-badge" [class]="row.perfil?.toLowerCase()">
                                    {{ row.perfil }}
                                </span>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="acoes">
                            <th mat-header-cell *matHeaderCellDef>Acoes</th>
                            <td mat-cell *matCellDef="let row" class="col-acoes">
                                <button mat-icon-button (click)="abrirEditar(row)" matTooltip="Editar">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-icon-button (click)="confirmarReativar(row)" matTooltip="Reativar">
                                    <mat-icon>restore</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>

                    <div class="no-data" *ngIf="!loadingInativos && usuariosInativos.data.length === 0">
                        <mat-icon>person_add</mat-icon>
                        <p>Todos os usuarios estao ativos</p>
                    </div>

                    <div class="loading-overlay" *ngIf="loadingInativos">
                        <mat-spinner diameter="40"></mat-spinner>
                    </div>
                </div>

                <mat-paginator [length]="totalInativosElements" [pageIndex]="pageIndexInativos"
                    [pageSize]="pageSizeInativos" [pageSizeOptions]="[5, 10, 20, 50]"
                    (page)="onPageChangeInativos($event)">
                </mat-paginator>
            </mat-card>
        </mat-tab>

    </mat-tab-group>
</div>
