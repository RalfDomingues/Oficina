<div class="page">
  <div class="header">
    <div>
      <h2>Ordens de Servico</h2>
      <p class="sub">Criar, editar e atualizar status das OS</p>
    </div>

    <div class="header-actions">
      <div class="header-filtros">
        <mat-form-field appearance="outline" class="campo-pesquisa">
          <mat-icon matPrefix>search</mat-icon>
          <input matInput [(ngModel)]="search" (ngModelChange)="onSearchChange()"
            placeholder="ID, cliente, veiculo, status, descricao, data..." aria-label="Pesquisar OS" />
          <button *ngIf="search" mat-icon-button matSuffix (click)="search=''; onSearchChange()" aria-label="Limpar">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>

      <button class="botao-criar" mat-raised-button color="primary" (click)="abrirCriar()">
        <mat-icon>add</mat-icon>
        Criar OS
      </button>
    </div>
  </div>

  <mat-card class="table-card">
    <div class="table-wrap" [class.loading]="loading">
      <table mat-table [dataSource]="tableData" class="table-base mat-elevation-z0">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let ordem">#{{ ordem.id }}</td>
        </ng-container>

        <ng-container matColumnDef="cliente">
          <th mat-header-cell *matHeaderCellDef>Cliente</th>
          <td mat-cell *matCellDef="let ordem">{{ clienteNome(ordem.clienteId) }}</td>
        </ng-container>

        <ng-container matColumnDef="veiculo">
          <th mat-header-cell *matHeaderCellDef>Veiculo</th>
          <td mat-cell *matCellDef="let ordem">{{ veiculoModelo(ordem.veiculoId) }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let ordem">
            <span class="status-pill" [attr.data-status]="ordem.status">{{ ordem.status }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef>Descrição</th>
          <td mat-cell *matCellDef="let ordem" class="col-descricao">
            {{ ordem.descricao }}
          </td>
        </ng-container>

        <ng-container matColumnDef="dataAbertura">
          <th mat-header-cell *matHeaderCellDef>Abertura</th>
          <td mat-cell *matCellDef="let ordem">{{ ordem.dataAbertura | date:'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let ordem" class="actions-cell">
            <div class="actions">
              <button mat-button (click)="abrirEditar(ordem)">
                <mat-icon>edit</mat-icon>
                Editar
              </button>

              <button mat-raised-button color="primary" [disabled]="!podeAvancar(ordem)" (click)="avancarStatus(ordem)">
                Avancar
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator [length]="tableTotal" [pageIndex]="isSearchMode ? localPageIndex : pageIndex"
      [pageSize]="isSearchMode ? localPageSize : pageSize" [pageSizeOptions]="[5,10,20,50]" (page)="onPage($event)">
    </mat-paginator>

  </mat-card>
</div>
