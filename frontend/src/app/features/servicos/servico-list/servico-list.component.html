<div class="page">
  <div class="header">
    <div>
      <h2>Servicos</h2>
      <p class="sub">Cadastre e gerencie servicos oferecidos.</p>
    </div>

    <div class="header-actions">
      <div class="header-filtros">
        <mat-form-field appearance="outline" class="campo-pesquisa">
          <mat-icon matPrefix>search</mat-icon>
          <input matInput [(ngModel)]="search" (ngModelChange)="onSearchChange()"
            placeholder="Nome do servico..." aria-label="Pesquisar servicos" />
          <button *ngIf="search" mat-icon-button matSuffix (click)="search=''; onSearchChange()" aria-label="Limpar">
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>

      <button *ngIf="podeGerenciarServicos" class="botao-criar" mat-raised-button color="primary" (click)="abrirCriar()">
        <mat-icon>add</mat-icon>
        Novo servico
      </button>
    </div>
  </div>

  <mat-tab-group [(selectedIndex)]="abaSelecionada" class="tabs-section">

    <mat-tab [label]="'Ativos (' + totalAtivosElementos + ')'">
      <mat-card class="table-card">
        <div class="table-wrap" [class.loading]="loading">
          <table mat-table [dataSource]="servicosAtivos" class="table-base">

            <ng-container matColumnDef="nome">
              <th mat-header-cell *matHeaderCellDef>Nome</th>
              <td mat-cell *matCellDef="let row" class="col-nome truncate">{{ row.nome }}</td>
            </ng-container>

            <ng-container matColumnDef="preco">
              <th mat-header-cell *matHeaderCellDef>Preco</th>
              <td mat-cell *matCellDef="let row" class="col-preco">{{ row.preco | currency:'BRL' }}</td>
            </ng-container>

            <ng-container *ngIf="podeGerenciarServicos" matColumnDef="acoes">
              <th mat-header-cell *matHeaderCellDef>Ações</th>
              <td mat-cell *matCellDef="let row" class="col-acoes">
                <button mat-icon-button (click)="abrirEditar(row)" aria-label="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button (click)="confirmarDelete(row)" aria-label="Excluir">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>

          <div class="no-data" *ngIf="!loading && servicosAtivos.data.length === 0">
            <mat-icon>build</mat-icon>
            <p>Nenhum servico ativo encontrado</p>
          </div>

          <div class="loading-overlay" *ngIf="loading">
            <mat-spinner diameter="40"></mat-spinner>
          </div>
        </div>

        <mat-paginator [length]="totalAtivosElementos" [pageIndex]="paginaIndiceAtivos"
          [pageSize]="tamanhoPaginaAtivos" [pageSizeOptions]="[5, 10, 20, 50]"
          (page)="onPageChangeAtivos($event)">
        </mat-paginator>
      </mat-card>
    </mat-tab>

    <mat-tab [label]="'Inativos (' + totalInativosElementos + ')'">
      <mat-card class="table-card">
        <div class="table-wrap" [class.loading]="loading">
          <table mat-table [dataSource]="servicosInativos" class="table-base">

            <ng-container matColumnDef="nome">
              <th mat-header-cell *matHeaderCellDef>Nome</th>
              <td mat-cell *matCellDef="let row" class="col-nome truncate">{{ row.nome }}</td>
            </ng-container>

            <ng-container matColumnDef="preco">
              <th mat-header-cell *matHeaderCellDef>Preco</th>
              <td mat-cell *matCellDef="let row" class="col-preco">{{ row.preco | currency:'BRL' }}</td>
            </ng-container>

            <ng-container *ngIf="podeGerenciarServicos" matColumnDef="acoes">
              <th mat-header-cell *matHeaderCellDef>Ações</th>
              <td mat-cell *matCellDef="let row" class="col-acoes">
                <button mat-icon-button (click)="reativar(row)" aria-label="Reativar">
                  <mat-icon>restore</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>

          <div class="no-data" *ngIf="!loading && servicosInativos.data.length === 0">
            <mat-icon>build</mat-icon>
            <p>Todos os servicos estao ativos</p>
          </div>

          <div class="loading-overlay" *ngIf="loading">
            <mat-spinner diameter="40"></mat-spinner>
          </div>
        </div>

        <mat-paginator [length]="totalInativosElementos" [pageIndex]="paginaIndiceInativos"
          [pageSize]="tamanhoPaginaInativos" [pageSizeOptions]="[5, 10, 20, 50]"
          (page)="onPageChangeInativos($event)">
        </mat-paginator>
      </mat-card>
    </mat-tab>

  </mat-tab-group>
</div>
