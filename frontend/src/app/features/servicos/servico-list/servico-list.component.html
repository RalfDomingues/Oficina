<div class="page-card">
  <div class="header">
    <h1>Serviços</h1>

    <button mat-raised-button color="primary" (click)="abrirCriar()">
      Novo Serviço
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 table">

    <!-- Nome -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef> Nome </th>
      <td mat-cell *matCellDef="let servico"> {{ servico.nome }} </td>
    </ng-container>

    <!-- Preço -->
    <ng-container matColumnDef="preco">
      <th mat-header-cell *matHeaderCellDef> Preço </th>
      <td mat-cell *matCellDef="let servico">
        {{ servico.preco | currency:'BRL' }}
      </td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="ativo">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let servico">
        {{ servico.ativo ? 'Ativo' : 'Inativo' }}
      </td>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="acoes-col"> Ações </th>
      <td mat-cell *matCellDef="let servico" class="acoes-col">
        <button mat-icon-button (click)="abrirEditar(servico)" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="confirmarDelete(servico)" aria-label="Excluir">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator
    [length]="totalElements"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPage($event)">
  </mat-paginator>
</div>
