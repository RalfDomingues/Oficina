<div class="page">
  <div class="header">
    <div>
      <h2>Serviços</h2>
      <p class="sub">Cadastre e gerencie serviços oferecidos.</p>
    </div>
    <button mat-raised-button color="primary" (click)="abrirCriar()">
      <mat-icon>add</mat-icon>
      Novo serviço
    </button>
  </div>

  <div class="toolbar">
    <mat-form-field appearance="outline" class="search">
      <mat-label>Pesquisar</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [(ngModel)]="search" (ngModelChange)="onSearchChange()" placeholder="Nome do serviço..." />
      <button *ngIf="search" mat-icon-button matSuffix (click)="search=''; onSearchChange()" aria-label="Limpar">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <!-- TABS -->
  <mat-tab-group [(selectedIndex)]="abaSelecionada" class="tabs-section">

    <!-- ABA 1: ATIVOS -->
    <mat-tab label="Ativos ({{ totalAtivos }})">
      <mat-card class="table-card">
        <div class="table-wrap" [class.loading]="loading">
          <table mat-table [dataSource]="servicosAtivos" class="table-base">

            <ng-container matColumnDef="nome">
              <th mat-header-cell *matHeaderCellDef>Nome</th>
              <td mat-cell *matCellDef="let row" class="col-nome truncate">{{ row.nome }}</td>
            </ng-container>

            <ng-container matColumnDef="preco">
              <th mat-header-cell *matHeaderCellDef>Preço</th>
              <td mat-cell *matCellDef="let row" class="col-preco">{{ row.preco | currency:'BRL' }}</td>
            </ng-container>

            <ng-container matColumnDef="acoes">
              <th mat-header-cell *matHeaderCellDef>Ações</th>
              <td mat-cell *matCellDef="let row" class="col-acoes">
                <button mat-icon-button (click)="abrirEditar(row)" aria-label="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button (click)="confirmarDelete(row)" aria-label="Excluir">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      </mat-card>
    </mat-tab>

    <!-- ABA 2: INATIVOS -->
    <mat-tab label="Inativos ({{ totalInativos }})">
      <mat-card class="table-card">
        <div class="table-wrap" [class.loading]="loading">
          <table mat-table [dataSource]="servicosInativos" class="table-base">

            <ng-container matColumnDef="nome">
              <th mat-header-cell *matHeaderCellDef>Nome</th>
              <td mat-cell *matCellDef="let row" class="col-nome truncate">{{ row.nome }}</td>
            </ng-container>

            <ng-container matColumnDef="preco">
              <th mat-header-cell *matHeaderCellDef>Preço</th>
              <td mat-cell *matCellDef="let row" class="col-preco">{{ row.preco | currency:'BRL' }}</td>
            </ng-container>

            <ng-container matColumnDef="acoes">
              <th mat-header-cell *matHeaderCellDef>Ações</th>
              <td mat-cell *matCellDef="let row" class="col-acoes">
                <button mat-icon-button (click)="reativar(row)" aria-label="Reativar">
                  <mat-icon>restore</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      </mat-card>
    </mat-tab>

  </mat-tab-group>
</div>
