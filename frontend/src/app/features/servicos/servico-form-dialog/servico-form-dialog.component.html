<h2 mat-dialog-title>{{ data.title }}</h2>

<div mat-dialog-content class="content">
  <mat-form-field appearance="outline" class="field">
    <mat-label>Nome</mat-label>
    <input matInput formControlName="nome" [formControl]="form.controls.nome" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="field">
    <mat-label>Preço</mat-label>
    <input matInput type="number" formControlName="preco" [formControl]="form.controls.preco" />
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="salvar()">Salvar</button>
</div>
